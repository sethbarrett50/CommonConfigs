name: ShellCheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          additional_files: ".bashrc .bash_aliases"
